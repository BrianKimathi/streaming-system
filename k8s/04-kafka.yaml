apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamx-kafka
  namespace: streamx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamx-kafka
  template:
    metadata:
      labels:
        app: streamx-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://streamx-kafka:29092,PLAINTEXT_HOST://localhost:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@streamx-kafka:29093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://streamx-kafka:29092,CONTROLLER://streamx-kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
---
apiVersion: v1
kind: Service
metadata:
  name: streamx-kafka
  namespace: streamx
spec:
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
  selector:
    app: streamx-kafka
