---
# --- API Gateway ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: streamx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: streamx/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: USER_SERVICE_URL
              value: "http://user-service:8082"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:8083"
            - name: SUBSCRIPTION_SERVICE_URL
              value: "http://subscription-service:8084"
            - name: BILLING_SERVICE_URL
              value: "http://billing-service:8085"
            - name: DEVICE_SERVICE_URL
              value: "http://device-service:8086"
            - name: MEDIA_SERVICE_URL
              value: "http://media-service:8087"
            - name: PLAYBACK_SERVICE_URL
              value: "http://playback-service:8088"
            - name: WATCH_HISTORY_SERVICE_URL
              value: "http://watch-history-service:8089"
            - name: TRENDING_SERVICE_URL
              value: "http://trending-service:8090"
            - name: ANALYTICS_SERVICE_URL
              value: "http://analytics-service:8091"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8092"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: streamx
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: api-gateway
