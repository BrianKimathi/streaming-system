name: StreamX CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Unit/Integration Tests
        run: mvn clean test -B

      - name: Package JARs
        run: mvn package -DskipTests -B

  docker-build:
    name: Build Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - catalog-service
          - subscription-service
          - billing-service
          - device-service
          - media-service
          - playback-service
          - watch-history-service
          - trending-service
          - analytics-service
          - notification-service
          - api-gateway

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR for ${{ matrix.service }}
        working-directory: ./backend
        run: mvn package -pl ${{ matrix.service }} -am -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          push: false
          tags: streamx/${{ matrix.service }}:latest

  k8s-validate:
    name: Validate Kubernetes Manifests
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubeval / kubectl dry-run
        uses: stefanprodan/kube-tools@v1
        with:
          command: |
            kubectl apply --dry-run=client -f backend/k8s/
