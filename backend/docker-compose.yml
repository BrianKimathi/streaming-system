version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: streamx-postgres
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: streamx
      POSTGRES_PASSWORD: streamx_password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamx -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streamx-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streamx-kafka
    ports:
      - "${KAFKA_PORT:-9093}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: streamx-auth-service
    ports:
      - "${AUTH_PORT:-18081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: streamx-user-service
    ports:
      - "${USER_PORT:-18082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: ./catalog-service/Dockerfile
    container_name: streamx-catalog-service
    ports:
      - "${CATALOG_PORT:-18083}:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
    depends_on:
      postgres:
        condition: service_healthy

  subscription-service:
    build:
      context: .
      dockerfile: ./subscription-service/Dockerfile
    container_name: streamx-subscription-service
    ports:
      - "${SUBSCRIPTION_PORT:-18084}:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/subscription_db
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: ./billing-service/Dockerfile
    container_name: streamx-billing-service
    ports:
      - "${BILLING_PORT:-18085}:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/billing_db
    depends_on:
      postgres:
        condition: service_healthy

  device-service:
    build:
      context: .
      dockerfile: ./device-service/Dockerfile
    container_name: streamx-device-service
    ports:
      - "${DEVICE_PORT:-18086}:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/device_db
    depends_on:
      postgres:
        condition: service_healthy

  media-service:
    build:
      context: .
      dockerfile: ./media-service/Dockerfile
    container_name: streamx-media-service
    ports:
      - "${MEDIA_PORT:-18087}:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/media_db
    depends_on:
      postgres:
        condition: service_healthy

  playback-service:
    build:
      context: .
      dockerfile: ./playback-service/Dockerfile
    container_name: streamx-playback-service
    ports:
      - "${PLAYBACK_PORT:-18088}:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/playback_db
    depends_on:
      postgres:
        condition: service_healthy

  watch-history-service:
    build:
      context: .
      dockerfile: ./watch-history-service/Dockerfile
    container_name: streamx-watch-history-service
    ports:
      - "${WATCH_HISTORY_PORT:-18089}:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/watch_history_db
    depends_on:
      postgres:
        condition: service_healthy

  trending-service:
    build:
      context: .
      dockerfile: ./trending-service/Dockerfile
    container_name: streamx-trending-service
    ports:
      - "${TRENDING_PORT:-18090}:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trending_db
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: ./analytics-service/Dockerfile
    container_name: streamx-analytics-service
    ports:
      - "${ANALYTICS_PORT:-18091}:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analytics_db
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    container_name: streamx-notification-service
    ports:
      - "${NOTIFICATION_PORT:-18092}:8092"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
    depends_on:
      postgres:
        condition: service_healthy

  admin-service:
    build:
      context: .
      dockerfile: ./admin-service/Dockerfile
    container_name: streamx-admin-service
    ports:
      - "${ADMIN_PORT:-18093}:8093"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/admin_db
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: streamx-api-gateway
    ports:
      - "${GATEWAY_PORT:-9080}:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CATALOG_SERVICE_URL: http://catalog-service:8083
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8084
      BILLING_SERVICE_URL: http://billing-service:8085
      DEVICE_SERVICE_URL: http://device-service:8086
      MEDIA_SERVICE_URL: http://media-service:8087
      PLAYBACK_SERVICE_URL: http://playback-service:8088
      WATCH_HISTORY_SERVICE_URL: http://watch-history-service:8089
      TRENDING_SERVICE_URL: http://trending-service:8090
      ANALYTICS_SERVICE_URL: http://analytics-service:8091
      NOTIFICATION_SERVICE_URL: http://notification-service:8092
      ADMIN_SERVICE_URL: http://admin-service:8093
    depends_on:
      - auth-service
      - user-service
      - catalog-service

  admin-web:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
    container_name: streamx-admin-web
    ports:
      - "${ADMIN_WEB_PORT:-9090}:80"

volumes:
  postgres_data:
