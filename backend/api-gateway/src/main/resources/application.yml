server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/profiles/**

        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/catalog/**

        - id: subscription-service
          uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/subscriptions/**

        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/billing/**

        - id: device-service
          uri: ${DEVICE_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/devices/**

        - id: media-service
          uri: ${MEDIA_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/media/**

        - id: playback-service
          uri: ${PLAYBACK_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/playback/**

        - id: watch-history-service
          uri: ${WATCH_HISTORY_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/watch-history/**

        - id: trending-service
          uri: ${TRENDING_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/trending/**

        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/analytics/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/v1/notifications/**

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/admin/**

jwt:
  secret: ${JWT_SECRET:9a6f8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.streamx.gateway: DEBUG
